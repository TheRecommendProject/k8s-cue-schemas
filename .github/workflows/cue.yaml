name: cue

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CUE_VERSION: v0.17.1
  SEMANTIC_RELEASE_VERSION: 26.0.1
  SR_EXEC_VERSION: 7.1.0
  CC_PRESET_VERSION: 10.4.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: cue-lang/setup-cue@v2.0.0
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Check formatting
        run: cue fmt --check ./...

      - name: Check module dependencies
        run: cue mod tidy --check

      - name: Validate schemas
        run: cue vet ./...

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: ${{ env.CUE_VERSION }}

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: lts/*

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set registry
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "CUE_REGISTRY=ghcr.io/${owner}/k8s-cue-schemas" >> "$GITHUB_ENV"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@${SEMANTIC_RELEASE_VERSION}
          -p @semantic-release/exec@${SR_EXEC_VERSION}
          -p conventional-changelog-conventionalcommits@${CC_PRESET_VERSION}
          semantic-release
